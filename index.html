<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSEB Class X Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a90e2">
<style>
:root {
--primary: #4a90e2;
--bg: #f4f7f6;
--card-bg: #ffffff;
--text: #333333;
--accent: #2ecc71;
}
* { box-sizing: border-box; }
body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
background-color: var(--bg);
color: var(--text);
margin: 0;
padding: 15px;
display: flex;
justify-content: center;
}
.container {
width: 100%;
max-width: 500px;
background: var(--card-bg);
padding: 20px;
border-radius: 16px;
box-shadow: 0 4px 15px rgba(0,0,0,0.05);
margin-top: 10px;
}
h1 {
text-align: center;
color: var(--primary);
margin: 0 0 5px 0;
font-size: 1.6rem;
}
.subtitle {
text-align: center;
color: #777;
margin-bottom: 20px;
font-size: 0.9rem;
}
.task-list {
display: flex;
flex-direction: column;
gap: 12px;
}
.task-item {
display: flex;
align-items: center;
padding: 14px;
background: #f9f9f9;
border-left: 5px solid var(--primary);
border-radius: 8px;
transition: all 0.2s ease;
}
.task-item.completed {
border-left-color: var(--accent);
background: #f0fdf4;
opacity: 0.65;
}
.task-item.completed span {
text-decoration: line-through;
color: #777;
}
.time-badge {
background: #eef2f7;
padding: 5px 8px;
border-radius: 6px;
font-size: 0.75rem;
font-weight: bold;
margin-right: 12px;
color: #555;
min-width: 95px;
text-align: center;
}
.task-text {
flex-grow: 1;
font-size: 0.95rem;
line-height: 1.3;
}
.audio-btn {
background: none;
border: none;
font-size: 1.2rem;
cursor: pointer;
margin-right: 10px;
-webkit-tap-highlight-color: transparent;
}
input[type="checkbox"] {
width: 22px;
height: 22px;
cursor: pointer;
accent-color: var(--accent);
}
.btn-group {
display: flex;
gap: 10px;
margin-top: 25px;
}
.action-btn {
flex: 1;
padding: 14px;
border: none;
border-radius: 8px;
font-size: 0.95rem;
font-weight: bold;
cursor: pointer;
}
.reset-btn { background: var(--primary); color: white; }
.noti-btn { background: #e0e0e0; color: #333; }
</style>
</head>
<body>
<div class="container">
<h1>GSEB Class X Tracker</h1>
<div class="subtitle">Daily Routine & Smart Reminders</div>

<div class="task-list" id="taskList"></div>
<div class="btn-group">
<button class="action-btn noti-btn" onclick="requestNotificationPermission()">🔔 Allow Watch Alerts</button>
<button class="action-btn reset-btn" onclick="resetTasks()">Reset Tasks</button>
</div>
</div>
<script>
const schedule = [
{ time: "06:00 - 07:15 AM", text: "Morning Session: Chemistry Reactions and Language Textbooks" },
{ time: "03:00 - 04:30 PM", text: "Tuition Batch One: Take Active Notes" },
{ time: "05:00 - 07:00 PM", text: "Tuition Batch Two: Stay Focused" },
{ time: "07:45 - 09:00 PM", text: "Self Study: Mathematics Practice and Social Science" },
{ time: "09:45 - 10:45 PM", text: "Tuition Review: Complete Day's Homework" }
];
let taskStates = JSON.parse(localStorage.getItem('gseb_tasks')) || new Array(schedule.length).fill(false);
function renderTasks() {
const listEl = document.getElementById('taskList');
listEl.innerHTML = '';
schedule.forEach((task, index) => {
const isChecked = taskStates[index];
const item = document.createElement('div');
item.className = `task-item ${isChecked ? 'completed' : ''}`;

item.innerHTML = `
<div class="time-badge">${task.time}</div>
<button class="audio-btn" onclick="speakText('${task.text}')">🔊</button>
<div class="task-text"><span>${task.text}</span></div>
<input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTask(${index})">
`;
listEl.appendChild(item);
});
}
function toggleTask(index) {
taskStates[index] = !taskStates[index];
localStorage.setItem('gseb_tasks', JSON.stringify(taskStates));
renderTasks();
}
function speakText(phrase) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel(); // Stop any current speaking
const utterance = new SpeechSynthesisUtterance(phrase);
utterance.rate = 0.9; // Slightly slower for clear instruction
window.speechSynthesis.speak(utterance);
} else {
alert("Speech synthesis not supported on this device.");
}
}
function requestNotificationPermission() {
if (!("Notification" in window)) {
alert("This browser does not support desktop notification");
return;
}
Notification.requestPermission().then(permission => {
if (permission === "granted") {
new Notification("GSEB Tracker", { body: "Reminders are now paired to your device and watch!" });
}
});
}
function resetTasks() {
if(confirm("Reset checkboxes for tomorrow?")) {
taskStates = new Array(schedule.length).fill(false);
localStorage.setItem('gseb_tasks', JSON.stringify(taskStates));
renderTasks();
}
}
renderTasks();
</script>
</body>
</html>
