<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSEB Class X Reminder App</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .app-container {
            max-width: 600px;
            background: #ffffff;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* FIXED: Changed to vertical block layout so the icon stays centered above the text */
        .app-header {
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* FIXED: Enforced explicit width/height boundaries to override unscaled source images */
        .app-icon {
            width: 64px !important;
            height: 64px !important;
            max-width: 64px;
            max-height: 64px;
            object-fit: cover;
            border-radius: 14px;
            background-color: #e2e8f0; /* Fallback placeholder block while image resolves */
            display: block;
        }

        .app-title {
            font-size: 24px;
            margin: 0;
            color: #2d3748;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Chapters Layout styling */
        .chapters-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .chapter-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background-color: #f8fafc;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .chapter-item:hover {
            background-color: #edf2f7;
        }

        .chapter-label {
            display: flex;
            align-items: center;
            width: 100%;
            cursor: pointer;
            user-select: none;
        }

        .chapter-checkbox {
            width: 18px;
            height: 18px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #4CAF50; /* Green theme accent for completed metrics */
        }

        /* Completed State Classes handled by JS */
        .chapter-item.completed {
            opacity: 0.5;
            text-decoration: line-through;
            background-color: #e2e8f0;
            border-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="app-header">
            <img src="icon.png" alt="App Icon" class="app-icon" width="64" height="64">
            <h1 class="app-title">GSEB Class X Reminder</h1>
        </header>
        
        <p class="subtitle">Track your science curriculum progress dynamically</p>

        <ul class="chapters-list">
            
            <li class="chapter-item">
                <label class="chapter-label">
                    <input type="checkbox" class="chapter-checkbox" data-chapter="Chapter 6: Control and Coordination">
                    <span><strong>Chapter 6:</strong> Control and Coordination</span>
                </label>
            </li>

            <li class="chapter-item">
                <label class="chapter-label">
                    <input type="checkbox" class="chapter-checkbox" data-chapter="Chapter 7: How do Organisms Reproduce?">
                    <span><strong>Chapter 7:</strong> How do Organisms Reproduce?</span>
                </label>
            </li>

            <li class="chapter-item">
                <label class="chapter-label">
                    <input type="checkbox" class="chapter-checkbox" data-chapter="Chapter 8: Heredity">
                    <span><strong>Chapter 8:</strong> Heredity</span>
                </label>
            </li>

            <li class="chapter-item">
                <label class="chapter-label">
                    <input type="checkbox" class="chapter-checkbox" data-chapter="Chapter 9: Light - Reflection and Refraction">
                    <span><strong>Chapter 9:</strong> Light - Reflection and Refraction</span>
                </label>
            </li>

            <li class="chapter-item">
                <label class="chapter-label">
                    <input type="checkbox" class="chapter-checkbox" data-chapter="Chapter 10: The Human Eye and the Colourful World">
                    <span><strong>Chapter 10:</strong> The Human Eye and the Colourful World</span>
                </label>
            </li>

            <li class="chapter-item">
                <label class="chapter-label">
                    <input type="checkbox" class="chapter-checkbox" data-chapter="Chapter 11: Electricity">
                    <span><strong>Chapter 11:</strong> Electricity</span>
                </label>
            </li>

            <li class="chapter-item">
                <label class="chapter-label">
                    <input type="checkbox" class="chapter-checkbox" data-chapter="Chapter 12: Magnetic Effects of Electric Current">
                    <span><strong>Chapter 12:</strong> Magnetic Effects of Electric Current</span>
                </label>
            </li>

            <li class="chapter-item">
                <label class="chapter-label">
                    <input type="checkbox" class="chapter-checkbox" data-chapter="Chapter 13: Our Environment">
                    <span><strong>Chapter 13:</strong> Our Environment</span>
                </label>
            </li>

        </ul>
    </div>

    <script>
        const checkboxes = document.querySelectorAll('.chapter-checkbox');

        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const parentRow = this.closest('.chapter-item');
                const chapterTitle = this.getAttribute('data-chapter');

                if (this.checked) {
                    const confirmAction = confirm(`Mark "${chapterTitle}" as fully completed?`);
                    
                    if (confirmAction) {
                        parentRow.classList.add('completed');
                    } else {
                        // Restore state to unchecked instantly if cancelled
                        this.checked = false;
                    }
                } else {
                    // Manual safety restore path if unchecked down the line
                    parentRow.classList.remove('completed');
                }
            });
        });
    </script>
</body>
</html>
